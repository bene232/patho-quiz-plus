<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Patho-Quiz – Daten- & Logiktests</title></head>
<body>
<pre id="out">läuft …</pre>
<script>try { localStorage.clear(); } catch (e) {}</script>
<script src="../data/chapters.js"></script>
<script src="../data/kap01-tumor.js"></script>
<script src="../data/kap02-immun.js"></script>
<script src="../data/kap03-haemato.js"></script>
<script src="../data/kap04-herz.js"></script>
<script src="../data/kap05-gefaesse.js"></script>
<script src="../data/kap06-lunge.js"></script>
<script src="../data/kap07-magen.js"></script>
<script src="../data/kap08-kolon.js"></script>
<script src="../data/kap09-leber.js"></script>
<script src="../data/kap10-niere.js"></script>
<script src="../data/kap11-uro.js"></script>
<script src="../data/kap12-schilddruese.js"></script>
<script src="../data/kap13-mamma.js"></script>
<script src="../data/kap14-gyn.js"></script>
<script src="../data/kap15-knochen.js"></script>
<script src="../data/kap16-neuro.js"></script>
<script src="../data/kap17-kopf-hals.js"></script>
<script src="../js/store.js"></script>
<script src="../js/quiz.js"></script>
<script>
(function () {
  const lines = [];
  let fails = 0;
  function ok(cond, msg) { if (!cond) fails++; lines.push((cond ? 'PASS ' : 'FAIL ') + msg); }
  window.onerror = (m, src, l) => { fails++; lines.push('FAIL JS-Fehler: ' + m + ' @' + src + ':' + l); };

  /* ---------- Data ---------- */
  const pageRange = { 1: [4, 6], 2: [7, 9], 3: [10, 11], 4: [12, 15], 5: [16, 18], 6: [19, 22], 7: [23, 25], 8: [26, 28], 9: [29, 31], 10: [32, 35], 11: [36, 38], 12: [39, 41], 13: [42, 43], 14: [44, 46], 15: [47, 51], 16: [52, 56], 17: [57, 57] };
  const ids = new Set();
  const problems = [];
  const quotesBalanced = s => (s.match(/„/g) || []).length === (s.match(/“/g) || []).length;
  const texts = q => [q.q, q.ex, q.dis || ''].concat(q.opts || [], (q.st || []).map(x => x[0]));

  PQ.questions.forEach(q => {
    const p = msg => problems.push(q.id + ': ' + msg);
    if (ids.has(q.id)) p('doppelte ID');
    ids.add(q.id);
    const sec = PQ.sections[q.sec];
    if (!sec) p('unbekannter Abschnitt ' + q.sec);
    else if (sec.chapter !== q.chapter) p('Abschnitt gehört nicht zum Kapitel');
    if (!q.q || !q.ex) p('Fragetext oder Erklärung fehlt');
    const pages = String(q.p).split('–').map(Number);
    const [lo, hi] = pageRange[q.chapter];
    if (pages.some(n => !(n >= lo && n <= hi))) p('Seite ' + q.p + ' außerhalb ' + lo + '–' + hi);
    texts(q).forEach(t => {
      if (typeof t !== 'string') return;
      if (!quotesBalanced(t)) p('Anführungszeichen unausgeglichen: ' + t);
      if (/\s{2,}/.test(t)) p('doppeltes Leerzeichen: ' + t);
      if (t !== t.trim()) p('Leerzeichen am Rand: ' + t);
    });
    switch (q.type) {
      case 'single':
        if (!Array.isArray(q.opts) || q.opts.length < 3 || q.opts.length > 5) p('3–5 Optionen erwartet');
        else {
          if (!(Number.isInteger(q.a) && q.a >= 0 && q.a < q.opts.length)) p('Lösungsindex ungültig');
          if (new Set(q.opts).size !== q.opts.length) p('doppelte Optionen');
        }
        break;
      case 'kprim':
        if (!Array.isArray(q.st) || q.st.length !== 4) p('K-prim braucht 4 Aussagen');
        else {
          q.st.forEach((s, i) => { if (typeof s[0] !== 'string' || typeof s[1] !== 'boolean') p('Aussage ' + (i + 1) + ' ungültig'); });
          if (new Set(q.st.map(s => s[0])).size !== 4) p('doppelte Aussagen');
        }
        break;
      case 'tf':
        if (typeof q.a !== 'boolean') p('Richtig/Falsch-Lösung fehlt');
        break;
      default:
        p('unbekannter Typ ' + q.type);
    }
  });
  ok(problems.length === 0, 'Datenprüfung (' + PQ.questions.length + ' Fragen)' + (problems.length ? ':\n  ' + problems.join('\n  ') : ''));

  const byType = {};
  PQ.questions.forEach(q => { const k = 'Kap. ' + q.chapter + ' ' + q.type; byType[k] = (byType[k] || 0) + 1; });
  lines.push('INFO ' + JSON.stringify(byType));
  const tfBalance = PQ.questions.filter(q => q.type === 'tf').reduce((a, q) => (a[q.a] = (a[q.a] || 0) + 1, a), {});
  lines.push('INFO Richtig/Falsch-Verteilung ' + JSON.stringify(tfBalance));
  const kpBalance = PQ.questions.filter(q => q.type === 'kprim').flatMap(q => q.st.map(s => s[1])).reduce((a, v) => (a[v] = (a[v] || 0) + 1, a), {});
  lines.push('INFO K-prim-Aussagen ' + JSON.stringify(kpBalance));
  lines.push('INFO Altfragen: ' + PQ.questions.filter(q => q.alt).length + ', umstritten: ' + PQ.questions.filter(q => q.dis).length);
  PQ.chapters.filter(c => c.available).forEach(c => c.sections.forEach(s => {
    const n = PQ.questions.filter(q => q.sec === s.id).length;
    ok(n >= 3, 'Abschnitt ' + s.id + ' hat ' + n + ' Fragen');
  }));

  /* ---------- Scoring ---------- */
  const Q = PQ.quiz;
  const single = PQ.questions.find(q => q.type === 'single');
  ok(Q.evaluate(single, single.a).correct && Q.evaluate(single, single.a).score === 1, 'Einfachauswahl richtig');
  ok(!Q.evaluate(single, (single.a + 1) % single.opts.length).correct, 'Einfachauswahl falsch');
  const kp = PQ.questions.find(q => q.type === 'kprim');
  const truth = kp.st.map(s => s[1]);
  ok(Q.evaluate(kp, truth).score === 1 && Q.evaluate(kp, truth).correct, 'K-prim 4/4 = 1 Punkt');
  const three = truth.slice(); three[0] = !three[0];
  ok(Q.evaluate(kp, three).score === 0.5 && !Q.evaluate(kp, three).correct, 'K-prim 3/4 = ½ Punkt');
  const two = three.slice(); two[1] = !two[1];
  ok(Q.evaluate(kp, two).score === 0, 'K-prim 2/4 = 0 Punkte');
  const tf = PQ.questions.find(q => q.type === 'tf');
  ok(Q.evaluate(tf, tf.a).correct && !Q.evaluate(tf, !tf.a).correct, 'Richtig/Falsch-Bewertung');

  ok(!Q.isComplete(kp, [true, false, null, true]) && Q.isComplete(kp, [true, false, false, true]), 'K-prim vollständig erst mit 4 Antworten');
  ok(Q.isComplete(single, 0) && !Q.isComplete(single, null), 'Einfachauswahl vollständig');
  ok(Q.isComplete(tf, false) && !Q.isComplete(tf, null), 'Richtig/Falsch vollständig (auch bei false)');

  /* ---------- Filters & rounds ---------- */
  const allSecs = Object.keys(PQ.sections);
  const alt = Q.filter({ sections: allSecs, types: ['single', 'kprim', 'tf'], altOnly: true });
  ok(alt.length > 0 && alt.every(q => q.alt), 'Filter „Nur Altfragen“');
  const s3 = Q.filter({ sections: allSecs, types: ['single', 'kprim', 'tf'], minStars: 3 });
  ok(s3.length > 0 && s3.every(q => q.stars === 3), 'Filter „Nur ★★★“');
  const onlyKp = Q.filter({ sections: ['4.2'], types: ['kprim'] });
  ok(onlyKp.length > 0 && onlyKp.every(q => q.sec === '4.2' && q.type === 'kprim'), 'Filter Abschnitt + Typ');
  const order4 = PQ.chapters.find(c => c.id === 4).sections.map(s => s.id);
  const bs = Q.bySection(Q.shuffle(PQ.questions.filter(q => q.chapter === 4)));
  ok(bs.length === PQ.questions.filter(q => q.chapter === 4).length &&
    bs.every((q, i) => i === 0 || order4.indexOf(bs[i - 1].sec) <= order4.indexOf(q.sec)), '„Nach Themen“: Abschnitte in Skript-Reihenfolge');
  const cross = Q.bySection([PQ.byId['k10-01'], PQ.byId['k9-01']]);
  ok(cross[0].id === 'k9-01', '„Nach Themen“: Kapitel 9 vor 10 (nicht alphabetisch)');

  let identical = 0;
  for (let i = 0; i < 200; i++) {
    const sess = Q.createSession('practice', [single]);
    if (sess.views[0].order.every((v, j) => v === j)) identical++;
  }
  ok(identical === 0, 'Antworten werden nie in Originalreihenfolge gezeigt');
  const firstPos = {};
  for (let i = 0; i < 400; i++) {
    const pos = Q.createSession('practice', [single]).views[0].order.indexOf(single.a);
    firstPos[pos] = (firstPos[pos] || 0) + 1;
  }
  ok(Object.keys(firstPos).length === single.opts.length, 'Richtige Antwort landet auf allen Positionen ' + JSON.stringify(firstPos));

  /* ---------- Flashcards ---------- */
  const S = PQ.store;
  const id = 'k4-01';
  S.record(id, true, 10);
  ok(S.get(id).b === 3 && S.get(id).d > Date.now() && !S.isDue(id), 'Neu + gleich richtig → Box 3, morgen fällig');
  S.record(id, true, 10);
  ok(S.get(id).b === 4, 'Richtig → Box 4');
  S.record(id, false, 0);
  ok(S.get(id).b === 1 && S.isMistake(id), 'Falsch → zurück in Box 1 (offener Fehler)');
  S.record(id, true, 10);
  ok(S.get(id).b === 2 && !S.isMistake(id) && S.isShaky(id), 'Fehler korrigiert → Box 2 (wackelig)');
  for (let i = 0; i < 6; i++) S.record(id, true, 0);
  ok(S.get(id).b === 5, 'Box-Maximum 5');
  ok(S.get(id).n === 10 && S.get(id).c === 9, 'Zähler Versuche/richtig');
  ok(S.points() === 30, 'Punkte summiert');
  ok(S.streak() === 1 && S.todayCount() === 10, 'Serie und Tageszähler');

  S.record('k4-02', false, 0);
  const pool = Q.reviewPool();
  ok(pool.length === 1 && pool[0].id === 'k4-02', 'Wiederholen enthält offene Fehler');
  const prio = Q.prioritize(PQ.questions.filter(q => q.chapter === 4));
  ok(prio[0].id === 'k4-02', 'Üben: offene Fehler zuerst');
  const open = Q.filter({ sections: allSecs, types: ['single', 'kprim', 'tf'], openOnly: true });
  ok(open.length === PQ.questions.length - 1 && !open.some(q => q.id === id) && open.some(q => q.id === 'k4-02'),
    'Filter „Nur offene“: neu + Fehler, ohne Gesessenes');

  const code = S.exportCode();
  const file = S.exportData();
  S.reset();
  ok(!S.get(id) && S.points() === 0, 'Zurücksetzen');
  S.importData(code);
  ok(S.get(id) && S.get(id).b === 5 && S.points() === 30, 'Import per Code');
  S.reset();
  S.importData(file);
  ok(S.get(id) && S.get(id).b === 5, 'Import per Datei');
  let threw = false;
  try { S.importData('Unsinn'); } catch (e) { threw = true; }
  ok(threw && S.get(id), 'Ungültiger Import wird abgelehnt, Daten bleiben');

  /* ---------- Learning plan: guessed, old progress, spread reviews, repeat in the round ---------- */
  S.reset();
  S.record('k4-03', true, 10);
  ok(!S.isGuessed('k4-03'), 'Gleich richtig → nicht geraten');
  S.markGuessed('k4-03');
  ok(S.isShaky('k4-03') && S.isGuessed('k4-03') && Q.mastery('k4-03') === 'learning' && !S.isDue('k4-03'), '„Geraten“ → wackelig (Box 2), in ca. 3 h fällig');
  S.record('k4-03', true, 10);
  ok(!S.isGuessed('k4-03'), '„Geraten“ erledigt, sobald die Frage wieder richtig beantwortet ist');
  S.record('k4-06', false, 0);
  S.record('k4-06', true, 10);
  ok(!S.isGuessed('k4-06'), 'Korrigierter Fehler gilt nicht als geraten');
  S.markGuessed('k4-06');
  ok(S.isGuessed('k4-06'), 'Korrigiert, aber „Geraten“ gedrückt → bleibt offen');
  // Progress from before the mark: a box 2 never answered wrong can only be a guess
  S.importData(JSON.stringify({ v: 1, sched: 2, points: 0, days: {}, settings: {}, prefs: {},
    q: { 'k4-01': { b: 2, d: 0, n: 1, c: 1, l: 1, t: 1 }, 'k4-02': { b: 2, d: 0, n: 2, c: 1, l: 1, t: 1 } } }));
  ok(S.isGuessed('k4-01') && !S.isGuessed('k4-02'), 'Älterer Stand: Box 2 ohne Fehler gilt als geraten, ein korrigierter Fehler nicht');
  S.reset();

  // Progress from Patho-Quiz (schedule v1): box 2 never answered wrong → box 3; due dates counted from the last answer
  const HOUR = 3600000;
  const t0 = Date.now() - 5 * HOUR;
  S.importData(JSON.stringify({
    v: 1, points: 50, days: {}, settings: { theme: 'auto', dailyGoal: 300 }, prefs: {},
    q: {
      'k4-01': { b: 2, d: Date.now() + 9e8, n: 1, c: 1, l: 1, t: t0 },
      'k4-02': { b: 2, d: Date.now() + 9e8, n: 2, c: 1, l: 1, t: t0 },
      'k4-03': { b: 1, d: 0, n: 1, c: 0, l: 0, t: t0 },
      'k4-04': { b: 5, d: Date.now() + 9e8, n: 4, c: 4, l: 1, t: t0 }
    }
  }));
  ok(S.get('k4-01').b === 3 && !S.isDue('k4-01'), 'Alter Stand: Box 2 ohne Fehler → Box 3 (morgen fällig)');
  ok(S.get('k4-02').b === 2 && S.isDue('k4-02'), 'Alter Stand: wackelige Frage ist nach 3 h fällig');
  ok(S.isMistake('k4-03') && S.get('k4-04').b === 5 && S.points() === 50, 'Alter Stand: Fehler und Punkte bleiben');
  const code2 = S.exportCode();
  S.importData(code2);
  ok(S.get('k4-01').b === 3 && S.get('k4-02').b === 2, 'Umrechnung nur einmal (Plus-Stand bleibt beim Re-Import gleich)');
  S.setting('name', 'Testname');
  S.importData(code2);
  ok(S.setting('name') === 'Testname', 'Import aus Patho-Quiz behält den Namen');

  // First pass: lessons of only new questions in chapter and topic order, even with many mistakes
  S.reset();
  const ch7 = PQ.questions.filter(q => q.chapter === 7);
  ch7.forEach(q => S.record(q.id, false, 0));
  const lesson = Q.smartLesson(30);
  ok(lesson.length === 30 && lesson.every(q => !S.get(q.id)) && lesson.every(q => q.chapter === 1),
    'Erster Durchgang: 30 neue Fragen, Kapitel 1 zuerst, Fehler warten');
  const p = Q.plan();
  ok(p.fresh === PQ.questions.filter(q => !S.get(q.id)).length && p.mistakes === ch7.length && p.minutes > 0,
    'Plan: ' + p.fresh + ' neu, ' + p.mistakes + ' Fehler, ca. ' + p.minutes + ' min');

  // Last lesson of the first pass: the remaining new ones, filled up with reviews that are never first
  const left = PQ.questions.filter(q => !S.get(q.id));
  left.slice(10).forEach(q => S.record(q.id, true, 0));
  const lastLesson = Q.smartLesson(30);
  ok(lastLesson.length === 30 && lastLesson.filter(q => !S.get(q.id)).length === 10 && !!S.get(lastLesson[1].id) === false,
    'Letzte Runde des ersten Durchgangs: 10 neue + 20 Wiederholungen');

  // Review programme: only open mistakes and open guesses, mistakes of the last rounds first, then due guesses
  left.slice(0, 10).forEach(q => S.record(q.id, true, 0));
  ch7.slice(10).forEach(q => { S.get(q.id).t = Date.now() - 5 * 3600000; });
  const corrected = ch7.slice(-15);
  corrected.forEach(q => { S.record(q.id, true, 0); S.get(q.id).d = Date.now() - 1; });
  const guessedIds = left.slice(0, 5).map(q => q.id);
  guessedIds.forEach(id => { S.markGuessed(id); S.get(id).d = Date.now() - 1; });
  const review = Q.smartLesson(30);
  const reviewIds = review.map(q => q.id);
  ok(review.length === 30 && review.every(q => S.isMistake(q.id) || S.isGuessed(q.id)) &&
    ch7.slice(0, 10).map(q => q.id).concat(guessedIds).every(id => reviewIds.includes(id)) && !corrected.some(q => reviewIds.includes(q.id)),
    'Wiederholungsprogramm: nur offene Fehler und Geratene, die der letzten Runden zuerst, keine korrigierten');

  // Every right answer takes one off, so it comes to an end; afterwards extra rounds of questions once answered wrong
  const openCount = () => { const pl = Q.plan(); return pl.mistakes + pl.guessed; };
  const before = openCount();
  review.forEach(q => S.record(q.id, true, 0));
  ok(openCount() === before - 30, 'Jede richtige Antwort zählt runter: ' + before + ' → ' + openCount());
  let rounds = 0;
  while (openCount() && rounds < 50) { Q.smartLesson(30).forEach(q => S.record(q.id, true, 0)); rounds++; }
  const extra = Q.smartLesson(30);
  ok(!openCount() && extra.length && extra.every(q => S.get(q.id).n > S.get(q.id).c),
    'Fertig nach ' + rounds + ' weiteren Lektionen, danach Extra-Runden mit einmal falschen Fragen');

  // Just guessed: only when nothing else is open
  S.reset();
  PQ.questions.forEach(q => S.record(q.id, true, 0));
  S.record('k4-01', false, 0);
  S.markGuessed('k4-05');
  ok(Q.smartLesson(1)[0].id === 'k4-01' && Q.smartLesson(30).map(q => q.id).sort().join() === 'k4-01,k4-05',
    'Gerade geraten: kommt erst, wenn sonst nichts offen ist');

  // Chapters: 100 % exactly when the review programme has nothing left there
  const chapterPct = id => Q.progress(PQ.questions.filter(q => q.chapter === id)).pct;
  ok(chapterPct(4) < 100 && Q.isOpen('k4-05') && PQ.chapters.every(c => c.id === 4 || chapterPct(c.id) === 100),
    'Kapitel: 100 % überall außer Herz (1 Fehler + 1 Geratene offen, Herz ' + chapterPct(4) + ' %)');
  S.record('k4-01', true, 0);
  S.record('k4-05', true, 0);
  ok(PQ.chapters.every(c => chapterPct(c.id) === 100) && Q.progress(PQ.questions).pct === 100 && !Q.smartLesson(30).some(q => Q.isOpen(q.id)),
    'Alles erledigt → jedes Kapitel und alles zusammen 100 %');
  ok(Q.percent(1195, 1196) === 99 && Q.percent(1196, 1196) === 100 && Q.percent(0, 0) === 0, '99,9 % wird nicht als 100 % angezeigt');

  // Older mistakes by exam relevance, even if the less important ones are older; the number of questions stays the same
  S.reset();
  PQ.questions.forEach(q => S.record(q.id, true, 0));
  const pick = f => PQ.questions.filter(f).slice(0, 10).map(q => q.id);
  const tiers = [pick(q => q.alt), pick(q => !q.alt && q.stars === 3), pick(q => !q.alt && q.stars === 2), pick(q => !q.alt && q.stars < 2)];
  tiers.slice().reverse().flat().forEach((id, i) => { S.record(id, false, 0); S.get(id).t = Date.now() - 10 * HOUR + i * 1000; });
  const openBefore = Q.plan().mistakes;
  const order = tiers.map(() => { const l = Q.smartLesson(10).map(q => q.id); l.forEach(id => S.record(id, true, 0)); return l.sort().join(); });
  ok(openBefore === 40 && order.every((l, i) => l === tiers[i].slice().sort().join()) && !Q.plan().mistakes,
    'Ältere Fehler: erst Altfragen, dann ★★★, ★★, Rest – genau dieselben 40 Fragen');
  S.reset();

  S.saveSession({ mode: 'practice', ids: ['k4-01'] });
  ok(S.loadSession().ids[0] === 'k4-01', 'Runde wird zwischengespeichert');
  S.saveSession(null);
  ok(S.loadSession() === null, 'Zwischenspeicher gelöscht');

  lines.unshift(fails ? 'ERGEBNIS: ' + fails + ' Fehler' : 'ERGEBNIS: alles grün');
  document.getElementById('out').textContent = lines.join('\n');
  try { localStorage.clear(); } catch (e) {}
})();
</script>
</body>
</html>
