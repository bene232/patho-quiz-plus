<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Patho-Quiz – UI-Test</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app"></div>
<pre id="ui-out" style="white-space:pre-wrap;font-size:12px;padding:16px">läuft …</pre>
<script>
  // Clean start; ?shot=… stops at a checkpoint (for screenshots), ?theme=dark|light forces the color scheme
  try { localStorage.clear(); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
  window.__errors = [];
  window.addEventListener('error', e => window.__errors.push(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
  window.confirm = () => true;
</script>
<script src="../data/chapters.js"></script>
<script src="../data/kap01-tumor.js"></script>
<script src="../data/kap02-immun.js"></script>
<script src="../data/kap03-haemato.js"></script>
<script src="../data/kap04-herz.js"></script>
<script src="../data/kap05-gefaesse.js"></script>
<script src="../data/kap06-lunge.js"></script>
<script src="../data/kap07-magen.js"></script>
<script src="../data/kap08-kolon.js"></script>
<script src="../data/kap09-leber.js"></script>
<script src="../data/kap10-niere.js"></script>
<script src="../data/kap11-uro.js"></script>
<script src="../data/kap12-schilddruese.js"></script>
<script src="../data/kap13-mamma.js"></script>
<script src="../data/kap14-gyn.js"></script>
<script src="../data/kap15-knochen.js"></script>
<script src="../data/kap16-neuro.js"></script>
<script src="../data/kap17-kopf-hals.js"></script>
<script src="../js/store.js"></script>
<script src="../js/quiz.js"></script>
<script>
  PQ.ASSET_BASE = '../';
  if (new URLSearchParams(location.search).get('theme')) PQ.store.setting('theme', new URLSearchParams(location.search).get('theme'));
</script>
<script src="../js/app.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const shot = params.get('shot');
  const out = document.getElementById('ui-out');
  const lines = [];
  let fails = 0;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => [...(root || document).querySelectorAll(sel)];
  const ok = (c, m) => { if (!c) fails++; lines.push((c ? 'PASS ' : 'FAIL ') + m); };
  const btn = text => $$('button').find(b => b.textContent.trim().startsWith(text));
  const nav = async hash => { location.hash = hash; await sleep(40); };
  const cp = name => { if (shot === name) { out.hidden = true; throw 'STOP'; } };
  const session = () => PQ.app.getSession();
  const cur = () => PQ.byId[session().ids[session().idx]];
  const ALL = Object.keys(PQ.sections);
  const TYPES = ['single', 'kprim', 'tf'];
  const next = () => (btn('Weiter') || btn('Zur Auswertung')).click();
  const inDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return PQ.store.dayKey(d.getTime()); };
  const imgsOk = async label => {
    await sleep(80);
    const imgs = $$('img.art');
    const bad = imgs.filter(i => !i.complete || !i.naturalWidth).map(i => i.getAttribute('src'));
    ok(imgs.length > 0 && !bad.length, label + ': ' + imgs.length + ' Bilder geladen' + (bad.length ? ', fehlen: ' + bad.join(', ') : ''));
  };

  async function answer(correct) {
    const q = cur();
    if (q.type === 'single') {
      const target = correct ? q.opts[q.a] : q.opts.find((o, i) => i !== q.a);
      $$('.opt').find(b => $('.opt-text', b).textContent === target).click();
    } else if (q.type === 'tf') {
      const want = correct ? q.a : !q.a;
      $$('.tf-btn').find(b => b.textContent.includes(want ? 'Richtig' : 'Falsch')).click();
    } else if (q.type === 'kprim') {
      q.st.forEach((st, i) => {
        const want = correct || i > 0 ? st[1] : !st[1];
        $$('.kp-btn', $$('.kp-row')[i])[want ? 0 : 1].click();
      });
    }
    await sleep(10);
  }

  async function playThrough(n, correct) {
    for (let i = 0; i < n; i++) {
      await answer(correct);
      btn('Prüfen').click();
      await sleep(10);
      next();
      await sleep(20);
    }
  }

  try {
    /* ---------- First start: welcome ---------- */
    await sleep(50);
    ok($('.welcome-hero') && $('.mascot-welcome') && $('textarea.code'), 'Erster Start: Begrüßung mit Maskottchen, Name und Code-Übernahme');
    cp('welcome');
    $('.welcome .input').value = 'Mia';
    btn('Los geht').click();
    await sleep(40);
    ok(PQ.store.setting('name') === 'Mia' && PQ.store.pref('welcomed') && $('.hero'), 'Name gespeichert, weiter zur Startseite');

    /* ---------- Home ---------- */
    PQ.store.setting('examDate', inDays(3)); // the plan strip shows up to 6 days before the exam
    PQ.app.route();
    await sleep(30);
    ok($('.logo') && $('.hero .mascot'), 'Startseite mit Maskottchen');
    ok($('.hero-kicker') && $('.hero-kicker').textContent === 'Noch 3 Tage bis zur Klausur', 'Countdown: ' + ($('.hero-kicker') && $('.hero-kicker').textContent));
    ok(/Mia/.test($('.bubble').textContent), 'Begrüßung mit Namen: ' + $('.bubble').textContent);
    ok($('.hero-title').textContent === 'Noch ' + PQ.questions.length + ' neue Fragen' && /^0 % einmal gekreuzt · noch ca\. \d+ h/.test($('.hero-meta').textContent),
      'Plan: ' + $('.hero-title').textContent + ' · ' + $('.hero-meta').textContent);
    ok($$('.plan-day').length === 4 && $('.plan-day.today .plan-count').textContent === '0 gekreuzt' && $$('.plan-day')[3].classList.contains('exam') &&
      $$('.plan-task').map(t => t.textContent).join() === 'Neues lernen,Alles einmal,Festigen,Klausur', 'Plan bis zur Klausur: ' + $$('.plan-task').map(t => t.textContent).join(' → '));
    ok($$('.quick-btn').length === 3, '3 Schnellzugriffe');
    const avail = PQ.chapters.filter(c => c.available).length;
    ok($$('.tile').length === avail, avail + ' Kapitel-Kacheln');
    ok($$('.upcoming-row img').length === 17 - avail, (17 - avail) + ' kommende Kapitel als Bilder');
    ok(btn('Los geht') && !$('.hero-link'), 'Start-Button, keine Wiederholungen offen');
    await imgsOk('Startseite (alle 17 Kapitelbilder, Schnellzugriffe, Abzeichen)');
    cp('home-empty');

    /* ---------- Custom round ---------- */
    PQ.store.pref('practice', { sections: ALL, types: TYPES, count: 20 });
    await nav('#/practice');
    ok($$('.pick-ch').length === avail, 'Themenauswahl mit ' + avail + ' Kapiteln');
    ok(/^20 Fragen von \d+$/.test($('.setup-summary').textContent), 'Zusammenfassung: ' + $('.setup-summary').textContent);
    ok(!$$('.chip').some(c => /Zuordnen/.test(c.textContent)) && btn('K-prim') && btn('Richtig/Falsch'), 'Fragetypen ohne Zuordnen');
    $('.pick-toggle').click();
    await sleep(10);
    ok(!$('.pick-secs').hidden, 'Themen aufklappbar');
    cp('practice-setup');
    btn('Nur Altfragen').click();
    await sleep(10);
    const altText = $('.setup-summary').textContent;
    btn('Alle Fragen').click();
    ok(/\d+ Fragen/.test(altText), 'Filter Altfragen: ' + altText);

    /* ---------- Practice: each question type right and wrong; wrong ones come back in the round ---------- */
    PQ.app.startSession('practice', ['k4-02', 'k4-43', 'k4-t10', 'k4-03', 'k4-09', 'k5-02', 'k5-01', 'k5-t02'].map(id => PQ.byId[id]), { origin: { kind: 'custom' } });
    await sleep(40);
    ok($('.q-text'), 'Quiz zeigt Frage');
    ok($('.quiz-top .mascot-runner') && $('.runner-say') && /Los geht|Auf geht|schaffst|[Kk]reuzen/.test($('.runner-say').textContent), 'Zelli sitzt auf dem Fortschrittsbalken und feuert an: ' + ($('.runner-say') && $('.runner-say').textContent));
    const plan = [true, true, true, true, false, false, false, false];
    for (let i = 0; i < plan.length; i++) {
      const q = cur();
      ok(btn('Prüfen').disabled, q.id + ': Prüfen gesperrt vor Antwort');
      cp('quiz-' + q.type + (plan[i] ? '' : '-wrong'));
      await answer(plan[i]);
      ok(!btn('Prüfen').disabled, q.id + ': Prüfen aktiv nach Antwort');
      btn('Prüfen').click();
      await sleep(30);
      const fb = $('.sheet');
      const want = plan[i] ? 'ok' : q.type === 'kprim' ? 'part' : 'bad';
      const mood = plan[i] ? 'cheer' : q.type === 'kprim' ? 'happy' : 'comfort';
      ok($('.quiz-top .mascot-runner.mood-' + mood), q.id + ': Zelli auf dem Fortschrittsbalken reagiert (' + mood + ')');
      ok(fb && fb.classList.contains(want) && $('.mascot-fb', fb), q.id + ' (' + q.type + '): Rückmeldung mit Maskottchen ' + (fb && fb.className));
      ok(fb && $('.src', fb).textContent.includes('S. ' + q.p), q.id + ': Quelle mit Seite');
      ok(!btn('Prüfen'), q.id + ': Prüfen-Button ersetzt');
      if (q.dis) ok($('.dis', fb), q.id + ': Hinweis „umstritten“ sichtbar');
      if (plan[i]) ok(btn('Geraten?'), q.id + ': „Geraten?“ wird angeboten');
      else ok(/^Kommt bald nochmal dran\./.test($('.fb-cheer', fb).textContent) && session().ids.length === 8, q.id + ': Mutmach-Satz, Frage kommt später nochmal, Runde bleibt bei 8');
      cp('feedback-' + q.type + (plan[i] ? '' : '-wrong'));
      next();
      await sleep(30);
    }
    ok(location.hash === '#/result', 'Auswertung nach letzter Frage, keine Wiederholung in derselben Runde');
    ok($('.rstat-val').textContent === '4/8', 'Ergebnis 4/8: ' + ($('.rstat-val') && $('.rstat-val').textContent));
    ok($('.mascot-result') && $('.result-hero .muted').textContent.startsWith('8 Fragen gekreuzt.'), 'Auswertung mit Maskottchen und Mutmach-Satz: ' + $('.result-hero .muted').textContent);
    ok($('.new-badges') && /Losgelegt/.test($('.new-badges').textContent), 'Neues Abzeichen „Losgelegt“');
    ok($('.res-plan') && /neue Fragen/.test($('.res-plan').textContent), 'Fortschritt im Plan: ' + $('.res-plan-text').textContent);
    ok($('.res-list').hidden, 'Antwortliste zunächst eingeklappt');
    btn('Antworten ansehen').click();
    ok(!$('.res-list').hidden && $$('.res-row').length === 8, '8 Antworten gelistet');
    $$('.res-row')[5].click();
    await sleep(10);
    ok(!$$('.res-detail')[5].hidden && $('.res-detail .fb-inline'), 'Detail zeigt die Erklärung');
    ok(btn('Neue Runde') && btn('Fehler (4)'), 'Aktionen: Neue Runde + Fehler (4)');
    await imgsOk('Auswertung');
    cp('result');
    ok(PQ.store.points() > 0, 'Punkte vergeben: ' + PQ.store.points());

    /* ---------- Home with progress → practice mistakes ---------- */
    await nav('#/');
    const link = $('.hero-link');
    ok(link && link.textContent === 'Lieber erst Fehler üben', 'Hero bietet Fehler an, ohne Zahl: ' + (link && link.textContent));
    ok(btn('Weiterlernen'), 'Hero-Button heißt jetzt „Weiterlernen“');
    ok($('.plan-day.today .plan-count').textContent === '8 gekreuzt', 'Plan zählt heute 8 gekreuzte Fragen');
    ok(Number($('.pill-btn').textContent) >= 1, 'Abzeichen-Zähler: ' + $('.pill-btn').textContent);
    const greet = $('.hero .bubble').textContent;
    ok(/Tipp mich an!$/.test(greet), 'Zelli lädt zum Antippen ein');
    $('.hero .zelli-btn').click();
    ok($('.hero .bubble').textContent !== greet && $('.hero .zelli-btn .mood-cheer') && PQ.store.pref('zelliTapped'), 'Antippen: Zelli hüpft und sagt etwas: ' + $('.hero .bubble').textContent);
    cp('home-progress');
    link.click();
    await sleep(40);
    ok(session().mode === 'review' && session().ids.length === 4, 'Fehlerrunde mit 4 Fragen');
    ok($('.q-again') && /Die kennst du schon/.test($('.runner-say').textContent), 'Alter Fehler: markiert mit „Nochmal“, Zelli: ' + $('.runner-say').textContent);
    await playThrough(4, true);
    ok($('.rstat-val').textContent === '4/4', 'Fehlerrunde 4/4');
    ok(btn('Weiterlernen'), 'Nach der Fehlerrunde: weiterlernen');
    await nav('#/');
    ok(!$('.hero-link'), 'Keine offenen Fehler mehr');

    /* ---------- Continue learning ---------- */
    btn('Weiterlernen').click();
    await sleep(40);
    ok(session().origin.kind === 'smart' && session().ids.length === 30, 'Lektion mit 30 Fragen');
    ok(session().ids.every(id => !PQ.store.get(id) || PQ.store.isMistake(id) || PQ.store.isDue(id)), 'Lektion enthält nur Neues/Fälliges');
    await playThrough(30, true);
    await sleep(300);
    ok(btn('Nächste Lektion'), 'Auswertung bietet „Nächste Lektion“');
    ok($('.confetti'), 'Konfetti bei 100 %');

    /* ---------- Badges ---------- */
    await nav('#/badges');
    const got = $$('.badge.got').map(b => $('.badge-title', b).textContent);
    ok($$('.badge').length === 17 + PQ.chapters.length && ['Losgelegt', 'Fehlerfrei', 'Heiße Serie'].every(t => got.includes(t)), 'Abzeichen: ' + got.join(', '));
    await imgsOk('Abzeichen');
    cp('badges');

    /* ---------- „Geraten?“ (guessed) ---------- */
    PQ.app.startSession('practice', ['k4-05', 'k4-12'].map(id => PQ.byId[id]), { origin: { kind: 'custom' } });
    await sleep(40);
    await answer(true);
    btn('Prüfen').click();
    await sleep(20);
    btn('Geraten?').click();
    await sleep(10);
    ok(PQ.store.isShaky('k4-05') && session().ids.length === 2 && $('.q-count').textContent === '1/2' && $('.fb-guess').disabled,
      '„Geraten?“: Frage gilt als wackelig und kommt später nochmal, Runde bleibt gleich lang');
    $('.quiz-top .icon-btn').click();
    btn('Beenden und auswerten').click();
    await sleep(30);

    /* ---------- Pause reminder after 45 minutes ---------- */
    PQ.store.pref('clock', { start: Date.now() - 50 * 60000, last: Date.now() - 60000 });
    PQ.app.startSession('practice', [PQ.byId['k4-12']], { origin: { kind: 'custom' } });
    await sleep(40);
    await playThrough(1, true);
    await sleep(1100);
    ok($('.menu.pause') && /seit 5\d Minuten/.test($('.menu.pause').textContent), 'Pausen-Erinnerung nach 45 Minuten');
    cp('pause');
    btn('Pause starten').click();
    await sleep(20);
    ok(/^[45]:\d\d$/.test($('.pause-timer').textContent), 'Pausen-Timer läuft: ' + $('.pause-timer').textContent);
    btn('Pause beenden').click();
    await sleep(20);
    ok((PQ.store.pref('badges') || {}).pause && Date.now() - PQ.store.pref('clock').start < 5000, 'Pause beendet: Uhr zurückgesetzt, Abzeichen „Pausen-Profi“');
    $('.menu.pause .btn-primary').click();
    ok(!$('.menu.pause'), 'Dialog geschlossen');

    /* ---------- Chapter page: topics, count, order ---------- */
    const herz = PQ.questions.filter(q => q.chapter === 4);
    const summary = () => $('.setup-summary').textContent;
    const seg = text => $$('.seg-btn').find(b => b.textContent === text);
    await nav('#/chapter/4');
    ok($('.ch-hero-title').textContent === 'Herz' && $$('.topic').length === 9, 'Kapitel Herz mit 9 Themen');
    ok($$('.topic.on').length === 9 && seg('Alle').classList.contains('on') && seg('Gemischt').classList.contains('on'), 'Standard: alle Themen, alle Fragen, gemischt');
    ok(summary() === herz.length + ' Fragen', 'Ganzes Kapitel: ' + summary());
    ok(btn('Nur offene') && btn('Nur Altfragen ('), 'Filter „Nur offene“ und „Nur Altfragen“');
    await imgsOk('Kapitelseite');
    cp('chapter');
    btn('Alle abwählen').click();
    ok(summary() === 'Bitte mindestens ein Thema wählen' && btn('Starten').disabled, 'Ohne Thema kein Start');
    $$('.topic')[1].click();
    $$('.topic')[7].click();
    const two = herz.filter(q => q.sec === '4.2' || q.sec === '4.8').length;
    ok(summary() === two + ' Fragen' && btn('Alle auswählen'), 'Themen 4.2 + 4.8: ' + summary());
    seg('25').click();
    seg('Nach Themen').click();
    ok(summary() === '25 Fragen von ' + two, 'Anzahl 25: ' + summary());
    cp('chapter-pick');
    btn('Starten').click();
    await sleep(40);
    const secs = session().ids.map(id => PQ.byId[id].sec);
    ok(session().origin.kind === 'chapter' && secs.length === 25 && secs.every(x => x === '4.2' || x === '4.8'), '25 Fragen aus 4.2 + 4.8 gestartet');
    ok(secs.join() === secs.slice().sort().join(), 'Nach Themen: erst 4.2, dann 4.8');
    ok($('.q-count').textContent === '1/25', 'Zähler 1/25');

    /* ---------- X: keep practicing, pause, score early ---------- */
    await playThrough(3, true);
    ok($('.q-count').textContent === '4/25', 'Zähler nach 3 Antworten: 4/25');
    $('.quiz-top .icon-btn').click();
    await sleep(10);
    ok($('.menu') && /3 von 25 Fragen gekreuzt/.test($('.menu').textContent), 'Menü: 3 von 25 gekreuzt');
    cp('quiz-menu');
    btn('Weiterüben').click();
    ok(!$('.menu') && location.hash === '#/quiz', 'Weiterüben schließt das Menü');
    $('.quiz-top .icon-btn').click();
    btn('Pause').click();
    await sleep(30);
    ok(location.hash === '#/' && PQ.store.loadSession() && btn('Fortsetzen') && /Üben 3\/25/.test($('.hero-link').textContent), 'Pause: Startseite bietet Fortsetzen (Üben 3/25)');

    window.confirm = () => false;
    await nav('#/chapter/4');
    ok($$('.topic.on').length === 2 && seg('25').classList.contains('on') && seg('Nach Themen').classList.contains('on'), 'Kapitelseite merkt sich die Auswahl');
    const before = session().ids.join();
    btn('Starten').click();
    await sleep(30);
    ok(session().ids.join() === before && location.hash === '#/chapter/4', 'Offene Runde wird nicht ohne Rückfrage überschrieben');
    window.confirm = () => true;

    await nav('#/');
    btn('Fortsetzen').click();
    await sleep(30);
    ok(location.hash === '#/quiz' && $('.q-count').textContent === '4/25', 'Fortsetzen öffnet die Runde bei Frage 4');
    $('.quiz-top .icon-btn').click();
    btn('Beenden und auswerten').click();
    await sleep(40);
    ok(location.hash === '#/result' && $('.rstat-val').textContent === '3/3' && !PQ.store.loadSession(), 'Vorzeitig beendet: Auswertung der 3 beantworteten Fragen');
    btn('Antworten ansehen').click();
    ok($$('.res-row').length === 3, '3 Antworten gelistet');

    /* ---------- Open questions only ---------- */
    await nav('#/chapter/4');
    btn('Nur offene').click();
    const openTwo = PQ.quiz.filter({ sections: ['4.2', '4.8'], types: TYPES, openOnly: true }).length;
    const k = Math.min(25, openTwo);
    ok(openTwo <= two - 3 && summary() === k + ' Fragen' + (k < openTwo ? ' von ' + openTwo : ''), 'Nur offene: ' + summary());
    btn('Starten').click();
    await sleep(40);
    ok(session().ids.length === k && session().ids.every(id => PQ.quiz.isOpen(id)), 'Runde enthält nur offene Fragen');
    $('.quiz-top .icon-btn').click();
    btn('Runde beenden').click();
    await sleep(30);
    ok(!PQ.store.loadSession() && location.hash === '#/', 'Ohne Antwort: „Runde beenden“ verwirft die Runde');

    /* ---------- Exam ---------- */
    PQ.store.pref('exam', { chapters: [4, 5], count: 20, perQ: 90 });
    await nav('#/exam');
    ok($('.setup-summary').textContent === '20 Fragen · 30 Minuten', 'Klausur-Setup: ' + $('.setup-summary').textContent);
    await imgsOk('Klausur-Setup');
    cp('exam-setup');
    btn('Klausur starten').click();
    await sleep(40);
    ok(session().mode === 'exam' && session().ids.every(id => ['single', 'kprim'].includes(PQ.byId[id].type)), 'Klausur nur Einfachauswahl + K-prim');
    ok($('.timer') && /^(29|30):/.test($('.timer').textContent), 'Timer läuft: ' + ($('.timer') && $('.timer').textContent));
    for (let i = 0; i < 3; i++) {
      await answer(true);
      ok(!$('.sheet'), 'Klausur: keine Rückmeldung vor Abgabe');
      btn('Weiter').click();
      await sleep(20);
    }
    $$('.quiz-top .icon-btn')[1].click();
    await sleep(10);
    ok($$('.nav-cell.done').length === 3, 'Übersicht markiert 3 beantwortete Fragen');
    cp('exam-grid');
    $$('.nav-cell')[19].click();
    await sleep(20);
    ok(session().idx === 19 && btn('Abgeben'), 'Sprung zur letzten Frage');
    btn('Abgeben').click();
    await sleep(40);
    ok(location.hash === '#/result' && /Klausur ausgewertet/.test($('.result-hero').textContent), 'Klausur-Auswertung');
    ok($('.rstat-val').textContent === '3/20' && $('.rstat-label').textContent === 'Punkte', 'Klausur 3/20 Punkte');
    ok(btn('Neue Klausur'), 'Neue Klausur anbieten');

    /* ---------- Speed round: wrong statements come back once ---------- */
    PQ.store.pref('blitz', { chapters: [4, 5], count: 20 });
    await nav('#/blitz');
    ok($('.setup-summary').textContent === '20 Aussagen', 'Blitz-Setup');
    btn('Start').click();
    await sleep(40);
    ok($('.swipe-card') && $$('.round-btn').length === 2, 'Karte und runde Buttons');
    cp('blitz');
    let answered = 0;
    let wrongs = 0;
    while (location.hash !== '#/result' && answered < 40) {
      const q = cur();
      const correct = answered % 4 !== 3;
      btn((correct ? q.a : !q.a) ? 'Richtig' : 'Falsch').click();
      await sleep(20);
      if (!correct) {
        wrongs += 1;
        ok($('.swipe-card.flash-bad') && $('.sheet .fb-truth'), 'Blitz: falsche Antwort wird erklärt');
        if (answered === 3) cp('blitz-wrong');
        next();
      }
      answered += 1;
      await sleep(400);
    }
    ok(location.hash === '#/result' && answered === 20 && $('.rstat-val').textContent === (answered - wrongs) + '/' + answered,
      'Blitzrunde: ' + $('.rstat-val').textContent);

    /* ---------- Statistics & settings ---------- */
    await nav('#/stats');
    ok($$('.big-stat').length === 3 && $$('.legend li').length === 4 && $$('.week-day').length === 7, 'Statistik: Zahlen, Woche, Legende');
    ok($('.week-day.today .week-val').textContent !== '', 'Heute ist beschriftet');
    await imgsOk('Statistik');
    cp('stats');
    await nav('#/settings');
    btn('Dunkel').click();
    ok(document.documentElement.getAttribute('data-theme') === 'dark', 'Dunkelmodus schaltbar');
    btn('Hell').click();
    ok(document.documentElement.getAttribute('data-theme') === 'light', 'Hellmodus schaltbar');
    btn('System').click();
    ok(!document.documentElement.hasAttribute('data-theme'), 'Systemmodus');
    btn('400').click();
    ok(PQ.store.setting('dailyGoal') === 400, 'Tagesziel änderbar');
    const [nameField, dateField] = $$('.set-fields .input');
    nameField.value = 'Mia B';
    nameField.dispatchEvent(new Event('change'));
    dateField.value = '2026-11-02';
    dateField.dispatchEvent(new Event('change'));
    ok(PQ.store.setting('name') === 'Mia B' && PQ.store.setting('examDate') === '2026-11-02', 'Name und Klausurtermin änderbar');
    cp('settings');
    const pts = PQ.store.points();
    const code = PQ.store.exportCode();
    btn('Fortschritt löschen').click();
    ok(PQ.store.points() === 0 && PQ.store.setting('name') === 'Mia B', 'Fortschritt gelöscht, Name bleibt');
    btn('Importieren').click();
    ok(!$('.import-panel').hidden, 'Import-Feld klappt auf');
    $('textarea.code').value = code;
    $('.import-panel .btn-primary').click();
    ok(PQ.store.points() === pts, 'Import stellt Punkte wieder her');

    /* ---------- Saved state and open round of the previous version ---------- */
    const oldState = {
      v: 1, points: 120, days: { '2026-10-26': 40 },
      q: { 'k4-01': { b: 3, d: 0, n: 2, c: 2, l: 1, t: 1 }, 'k6-01': { b: 1, d: 0, n: 1, c: 0, l: 0, t: 2 } },
      settings: { theme: 'auto', dailyGoal: 300 },
      prefs: { practice: { sections: ['4.1'], types: ['single'], count: 20 } }
    };
    PQ.store.importData(JSON.stringify(oldState));
    // Chapter round as the previous version saved it (no topics/count in origin), including a matching question (k4-04) that no longer exists
    const old = PQ.quiz.createSession('practice', ['k4-03', 'k4-05'].map(id => PQ.byId[id]), { origin: { kind: 'chapter', id: 4, altOnly: false } });
    old.ids.splice(1, 0, 'k4-04');
    old.views.splice(1, 0, { order: [2, 0, 1, 3] });
    old.responses.splice(1, 0, null);
    old.results.splice(1, 0, null);
    PQ.store.saveSession(old);
    await nav('#/chapter/4');
    ok($$('.topic.on').length === 9 && summary() === herz.length + ' Fragen', 'Ohne gespeicherte Kapitel-Auswahl: alle Themen, alle Fragen');
    await nav('#/');
    ok(PQ.store.setting('name') === 'Mia B' && $('.hero'), 'Import aus der Vorversion behält Namen und Begrüßung');
    ok(btn('Fortsetzen') && /Üben 0\/2/.test($('.hero-link').textContent), 'Offene Runde der Vorversion wird angeboten (ohne die entfernte Zuordnungsfrage)');
    btn('Fortsetzen').click();
    await sleep(30);
    await playThrough(2, true);
    ok(location.hash === '#/result' && $('.rstat-val').textContent === '2/2', 'Runde der Vorversion lässt sich zu Ende spielen');
    btn('Noch eine Runde').click();
    await sleep(40);
    ok(session().origin.kind === 'chapter' && session().ids.length === herz.length, '„Noch eine Runde“ startet das ganze Kapitel');
    const kept = JSON.parse(PQ.store.exportData()).data;
    ok(kept.q['k4-01'].b === 3 && kept.q['k6-01'].b === 1 && kept.points === 140 && kept.days['2026-10-26'] === 40 &&
      kept.prefs.practice.count === 20 && kept.settings.dailyGoal === 300, 'Lernstand der Vorversion bleibt erhalten');

    /* ---------- Zelli's outfit at 70 % seen, celebrated after the round ---------- */
    await nav('#/quiz');
    $('.quiz-top .icon-btn').click();
    btn('Runde beenden').click();
    await sleep(30);
    PQ.store.reset();
    PQ.store.pref('welcomed', true);
    PQ.store.pref('outfit', 0);
    const share = Math.ceil(PQ.questions.length * 0.7) - 5;
    PQ.questions.slice(0, share).forEach(q => PQ.store.record(q.id, true, 0));
    PQ.app.route();
    await sleep(30);
    ok(/Noch 5 Fragen kreuzen, dann bekommt Zelli ein Stethoskop/.test($('.hero-next').textContent) && !$('.hero .m-stetho'), 'Startseite: nächstes Outfit in Sicht: ' + $('.hero-next').textContent);
    btn('Weiterlernen').click();
    await sleep(40);
    await playThrough(30, true);
    await sleep(1100);
    ok($('.celebrate') && /Zelli hat ein Stethoskop bekommen!/.test($('.celebrate-title').textContent) && $('.celebrate .m-stetho'), 'Feier: Zelli bekommt ein Stethoskop');
    cp('celebrate');
    $('.celebrate .btn-primary').click();
    await sleep(20);
    await nav('#/');
    ok($('.hero .m-stetho') && /Brille/.test($('.hero-next').textContent), 'Zelli trägt jetzt ein Stethoskop, als Nächstes kommt die Brille');
  } catch (e) {
    if (e !== 'STOP') { fails++; lines.push('FAIL Abbruch: ' + (e && e.stack || e)); }
  }

  window.__errors.forEach(m => { fails++; lines.push('FAIL JS-Fehler: ' + m); });
  lines.unshift(fails ? 'UI-ERGEBNIS: ' + fails + ' Fehler' : 'UI-ERGEBNIS: alles grün');
  if (!shot) out.textContent = lines.join('\n');
})();
</script>
</body>
</html>
